name: Selenium Tests CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install allure-pytest

      - name: Run pytest with Allure
        run: pytest -v --alluredir=allure-results

      - name: Upload allure-results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/

  report:
    needs: test
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout code (нужен для настройки Pages)
        uses: actions/checkout@v4

      - name: Download allure-results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results/

      # Ставим Java (Allure требует Java)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Скачиваем Allure CLI вручную — самый надёжный вариант
      - name: Download Allure CLI
        run: |
          ALLURE_VERSION="2.20.0"
          ARCHIVE_NAME="allure-${ALLURE_VERSION}.tgz"
          DOWNLOAD_URL="https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/${ARCHIVE_NAME}"
          
          curl -L -o ${ARCHIVE_NAME} ${DOWNLOAD_URL}
          tar -xzf ${ARCHIVE_NAME}
          mv allure-${ALLURE_VERSION} allure
          echo "${GITHUB_WORKSPACE}/allure/bin" >> $GITHUB_PATH

      - name: Verify Allure
        run: allure --version

      - name: Generate Allure report
        run: allure generate allure-results -o allure-report --clean

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4